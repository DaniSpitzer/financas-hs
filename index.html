<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Hedy - Controle Simples</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { --primary: #1a73e8; --danger: #d93025; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; color: #666; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        
        button { background-color: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background-color: #ccc; }
        
        .btn-pdf { background-color: #2e7d32; margin-top: 30px; font-size: 18px; }

        .total-valor { font-size: 28px; font-weight: bold; color: var(--danger); text-align: center; margin: 15px 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 8px; text-align: left; }
        th { color: #555; text-transform: uppercase; font-size: 11px; }
        
        .delete-icon { 
            cursor: pointer; 
            color: var(--danger); 
            font-size: 16px; 
            padding: 5px;
            border-radius: 5px;
            transition: 0.2s;
        }
        .delete-icon:hover { background-color: #ffebee; }

        #previewGrafico { max-height: 200px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="formulario">
        <h2>Registar Despesa</h2>
        <label>Data</label>
        <input type="date" id="data">
        
        <label>Categoria</label>
        <select id="categoria">
            <option value="Alimentação">Alimentação</option>
            <option value="Saúde/Farmácia">Saúde/Farmácia</option>
            <option value="Casa/Contas">Casa/Contas</option>
            <option value="Cuidadora">Cuidadora</option>
            <option value="Limpeza/Manutenção">Limpeza/Manutenção</option>
            <option value="Saques">Saques</option>
            <option value="Outros">Outros</option>
        </select>
        
        <label>Valor (R$)</label>
        <input type="number" id="valor" step="0.01" placeholder="0.00">
        
        <label>Descrição</label>
        <input type="text" id="descricao" placeholder="O que comprou?">
        
        <button id="btnSalvar" onclick="adicionarDespesa()">Adicionar à Lista</button>
    </div>

    <div style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;">
        <label>Mês do Relatório:</label>
        <input type="month" id="filtroMes" onchange="carregarDados()">

        <div class="total-valor" id="displayTotal">R$ 0,00</div>
        <canvas id="previewGrafico"></canvas>

        <h3>Lista de Gastos</h3>
        <table id="tabelaPreview">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Categoria</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th style="text-align:center;">Apagar</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <button class="btn-pdf" onclick="gerarPDF()">📥 Baixar Relatório PDF</button>
</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbz4wQ2kK3AUPaI5B1Emz8WvqjERhhAxNDTkZcO8P6FIqZwxkfGrgIXXdivxz6h-eKYefw/exec";
let todasAsDespesas = [];
let meuGrafico;

async function carregarDados() {
    try {
        const response = await fetch(APP_URL);
        todasAsDespesas = await response.json();
        atualizarTela();
    } catch (e) { console.error("Erro ao carregar dados:", e); }
}

function atualizarTela() {
    const mesSelecionado = document.getElementById('filtroMes').value;
    const filtrados = todasAsDespesas.filter(d => d.data.startsWith(mesSelecionado));
    
    let total = 0;
    let resumoCat = {};
    const tbody = document.querySelector('#tabelaPreview tbody');
    tbody.innerHTML = '';

    // Ordenar por data (mais recente em cima)
    filtrados.sort((a,b) => new Date(b.data) - new Date(a.data)).forEach(d => {
        const v = parseFloat(d.valor);
        total += v;
        resumoCat[d.categoria] = (resumoCat[d.categoria] || 0) + v;

        const dataF = d.data.split('T')[0].split('-').reverse().slice(0,2).join('/');
        
        // Procurar o índice real na planilha
        const realIdx = todasAsDespesas.findIndex(item => item === d);

        tbody.innerHTML += `<tr>
            <td>${dataF}</td>
            <td>${d.categoria}</td>
            <td>${d.descricao || '-'}</td>
            <td>R$ ${v.toFixed(2)}</td>
            <td style="text-align:center;">
                <span class="delete-icon" onclick="deletarDespesa(${realIdx})">🗑️</span>
            </td>
        </tr>`;
    });

    document.getElementById('displayTotal').innerText = `R$ ${total.toFixed(2)}`;
    renderizarGrafico(resumoCat);
}

async function adicionarDespesa() {
    const payload = {
        data: document.getElementById('data').value,
        valor: document.getElementById('valor').value,
        categoria: document.getElementById('categoria').value,
        descricao: document.getElementById('descricao').value
    };

    if(!payload.data || !payload.valor) return alert("Preencha a data e o valor!");

    const btn = document.getElementById('btnSalvar');
    btn.innerText = "A enviar...";
    btn.disabled = true;

    await fetch(APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    
    document.getElementById('valor').value = "";
    document.getElementById('descricao').value = "";
    btn.innerText = "Adicionar à Lista";
    btn.disabled = false;
    carregarDados();
}

async function deletarDespesa(idx) {
    if(!confirm("Tem certeza que deseja apagar este lançamento?")) return;

    // Mostra um aviso temporário
    const btnPdf = document.querySelector('.btn-pdf');
    btnPdf.innerText = "Apagando...";
    btnPdf.disabled = true;

    try {
        await fetch(APP_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ action: "DELETE", index: idx }) 
        });
        
        // Pequena pausa para o Google processar
        setTimeout(() => {
            btnPdf.innerText = "📥 Baixar Relatório PDF";
            btnPdf.disabled = false;
            carregarDados();
        }, 500);

    } catch (e) { 
        alert("Erro ao apagar!"); 
        btnPdf.disabled = false;
    }
}

function renderizarGrafico(dados) {
    const ctx = document.getElementById('previewGrafico').getContext('2d');
    if (meuGrafico) meuGrafico.destroy();
    meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(dados),
            datasets: [{ data: Object.values(dados), backgroundColor: ['#4285F4', '#34A853', '#FBBC05', '#EA4335', '#9C27B0', '#00BCD4', '#FF9800'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom' } } }
    });
}

async function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const mesRef = document.getElementById('filtroMes').value;
    
    doc.setFontSize(18);
    doc.text("Relatório de Despesas - Hedy", 14, 20);
    doc.setFontSize(11);
    doc.text(`Referência: ${mesRef}`, 14, 27);

    const canvas = document.getElementById('previewGrafico');
    const imgData = canvas.toDataURL('image/png');
    doc.addImage(imgData, 'PNG', 60, 35, 90, 50);

    const filtrados = todasAsDespesas.filter(d => d.data.startsWith(mesRef));
    let resumoCat = {};
    let totalGeral = 0;
    
    filtrados.forEach(d => {
        resumoCat[d.categoria] = (resumoCat[d.categoria] || 0) + parseFloat(d.valor);
        totalGeral += parseFloat(d.valor);
    });

    doc.autoTable({
        startY: 95,
        head: [['Categoria', 'Subtotal (R$)']],
        body: Object.entries(resumoCat).map(([cat, val]) => [cat, val.toFixed(2)]),
        theme: 'striped',
        headStyles: { fillStyle: [26, 115, 232] }
    });

    doc.setFontSize(13);
    doc.text(`VALOR TOTAL: R$ ${totalGeral.toFixed(2)}`, 14, doc.lastAutoTable.finalY + 10);

    doc.autoTable({
        startY: doc.lastAutoTable.finalY + 20,
        head: [['Data', 'Categoria', 'Descrição', 'Valor']],
        body: filtrados.map(d => [
            d.data.split('T')[0].split('-').reverse().join('/'),
            d.categoria,
            d.descricao || '-',
            `R$ ${parseFloat(d.valor).toFixed(2)}`
        ])
    });

    doc.save(`Relatorio_Hedy_${mesRef}.pdf`);
}

window.onload = () => {
    const hoje = new Date();
    document.getElementById('filtroMes').value = hoje.getFullYear() + "-" + String(hoje.getMonth() + 1).padStart(2, '0');
    carregarDados();
};
</script>

</body>
</html>
