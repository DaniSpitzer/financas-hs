<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Hedy - Gestão Profissional</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary: #1a73e8;
            --secondary: #2e7d32;
            --warning: #fbbc04;
            --danger: #d93025;
            --bg: #f8f9fa;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 700px; }
        
        /* Formulário */
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; transition: border 0.3s; }
        input:focus { border-color: var(--primary); outline: none; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { cursor: pointer; padding: 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 16px; transition: transform 0.1s, opacity 0.3s; }
        button:active { transform: scale(0.98); }
        
        #btnAdicionar { background-color: var(--primary); color: white; }
        .btn-cancelar { background-color: #eee; color: #555; }
        .btn-pdf { background-color: var(--secondary); color: white; margin-top: 30px; width: 100%; }

        /* Estilos do Relatório */
        #area-report { padding: 20px; background: white; }
        .pdf-block { page-break-inside: avoid; margin-bottom: 30px; } /* Impede corte de páginas feio */
        
        .total-box { 
            background: #fff5f5; border: 2px solid var(--danger); border-radius: 12px;
            padding: 20px; text-align: center; margin: 20px 0;
        }
        .total-label { font-size: 14px; color: #666; text-transform: uppercase; }
        .total-valor { font-size: 32px; font-weight: 800; color: var(--danger); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #fcfcfc; color: #777; font-weight: 600; }
        
        .btn-edit { background: var(--warning); color: #333; padding: 6px 12px; font-size: 12px; width: auto; }
        
        #meuGrafico { max-height: 300px; margin: 0 auto; }

        /* Esconder na hora de gerar PDF */
        .no-export { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div id="area-registo">
        <h2 id="form-title">Despesas da Hedy</h2>
        <input type="hidden" id="editIndex" value="">

        <div class="form-group">
            <label>Data</label>
            <input type="date" id="data">
        </div>
        
        <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0,00">
        </div>
        
        <div class="form-group">
            <label>Categoria</label>
            <select id="categoria">
                <option value="Alimentação">Alimentação</option>
                <option value="Saúde/Farmácia">Saúde/Farmácia</option>
                <option value="Casa/Contas">Casa/Contas</option>
                <option value="Cuidadora">Cuidadora</option>
                <option value="Limpeza/Manutenção">Limpeza/Manutenção</option>
                <option value="Saques">Saques</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="descricao" placeholder="Onde ou o que comprou?">
        </div>
        
        <div class="btn-group">
            <button id="btnAdicionar" onclick="adicionarDespesa()">Adicionar Despesa</button>
            <button id="btnCancelar" class="btn-cancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar Edição</button>
        </div>
    </div>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #eee;">

    <div style="text-align: center; margin-bottom: 20px;">
        <label>Visualizar Mês:</label>
        <input type="month" id="filtroMes" onchange="carregarDadosFiltrados()" style="width: auto; display: inline-block;">
    </div>

    <div id="area-report">
        
        <div class="pdf-block">
            <h2 style="margin-bottom: 5px;">Relatório Mensal</h2>
            <h3 id="titulo-report" style="text-align:center; color: #666; font-weight: 400; margin-top: 0;"></h3>
            
            <div class="total-box">
                <div class="total-label">Gasto Total no Período</div>
                <div class="total-valor" id="valorTotal">R$ 0,00</div>
            </div>
            
            <canvas id="meuGrafico"></canvas>
        </div>

        <div class="pdf-block">
            <h3>Subtotal por Categoria</h3>
            <table id="tabelaCategorias">
                <thead>
                    <tr>
                        <th>Categoria</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="pdf-block">
            <h3>Detalhamento das Despesas</h3>
            <table id="tabelaDespesas">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Categoria</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th class="no-print-col">Ação</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

    <button class="btn-pdf" onclick="gerarPDF()">📥 Baixar Relatório Profissional (PDF)</button>
</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbwu8BrZb72UVrCnBSARtPze90salLnEy7opND4SUWHiDxj75-XItcZEsD6SmQp8T-olHw/exec";
let todasAsDespesas = [];
let meuGrafico;

async function carregarDados() {
    try {
        const response = await fetch(APP_URL);
        todasAsDespesas = await response.json();
        carregarDadosFiltrados();
    } catch (e) { console.error("Erro ao carregar:", e); }
}

function carregarDadosFiltrados() {
    const selector = document.getElementById('filtroMes').value; 
    if (!selector) return;
    const [anoAlvo, mesAlvo] = selector.split("-");
    
    const filtrados = todasAsDespesas.filter(d => {
        const dataPura = d.data.toString().split('T')[0]; 
        return dataPura.startsWith(selector);
    });

    const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    document.getElementById('titulo-report').innerText = meses[parseInt(mesAlvo) - 1] + " de " + anoAlvo;

    atualizarInterface(filtrados);
}

async function adicionarDespesa() {
    const btn = document.getElementById('btnAdicionar');
    const editIndex = document.getElementById('editIndex').value;
    const data = document.getElementById('data').value;
    const valor = parseFloat(document.getElementById('valor').value);
    const categoria = document.getElementById('categoria').value;
    const descricao = document.getElementById('descricao').value;

    if (!data || isNaN(valor)) return alert("Preencha data e valor!");

    btn.innerText = "Salvando no Google...";
    btn.disabled = true;

    const payload = { data, valor, categoria, descricao };
    if (editIndex !== "") payload.index = editIndex;

    try {
        await fetch(APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        });

        setTimeout(() => {
            cancelarEdicao();
            carregarDados();
        }, 1200);
    } catch (e) { alert("Erro ao salvar!"); btn.disabled = false; }
}

function prepararEdicao(idx) {
    const d = todasAsDespesas[idx];
    document.getElementById('data').value = d.data.toString().split('T')[0];
    document.getElementById('valor').value = d.valor;
    document.getElementById('categoria').value = d.categoria;
    document.getElementById('descricao').value = d.descricao;
    document.getElementById('editIndex').value = idx;

    document.getElementById('btnAdicionar').innerText = "Salvar Alteração";
    document.getElementById('btnAdicionar').style.backgroundColor = "#fbbc04";
    document.getElementById('btnCancelar').style.display = "block";
    document.getElementById('form-title').innerText = "📝 Editando Registro";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelarEdicao() {
    document.getElementById('editIndex').value = "";
    document.getElementById('valor').value = "";
    document.getElementById('descricao').value = "";
    document.getElementById('btnAdicionar').innerText = "Adicionar Despesa";
    document.getElementById('btnAdicionar').style.backgroundColor = "#1a73e8";
    document.getElementById('btnCancelar').style.display = "none";
    document.getElementById('form-title').innerText = "Despesas da Hedy";
    document.getElementById('btnAdicionar').disabled = false;
}

function atualizarInterface(dados) {
    const corpoTabela = document.querySelector('#tabelaDespesas tbody');
    corpoTabela.innerHTML = '';
    let total = 0;
    let resumo = {};

    // Ordenar: mais recentes primeiro
    dados.sort((a, b) => new Date(b.data) - new Date(a.data));

    dados.forEach((d) => {
        let v = parseFloat(d.valor);
        total += v;
        resumo[d.categoria] = (resumo[d.categoria] || 0) + v;

        const dataF = d.data.split('T')[0].split('-').reverse().slice(0,2).join('/');
        const realIdx = todasAsDespesas.findIndex(item => item === d);

        corpoTabela.innerHTML += `<tr>
            <td>${dataF}</td>
            <td><b>${d.categoria}</b></td>
            <td>${d.descricao || '-'}</td>
            <td>R$ ${v.toFixed(2)}</td>
            <td class="no-print-col"><button class="btn-edit" onclick="prepararEdicao(${realIdx})">Editar</button></td>
        </tr>`;
    });

    const corpoResumo = document.querySelector('#tabelaCategorias tbody');
    corpoResumo.innerHTML = '';
    Object.keys(resumo).forEach(cat => {
        corpoResumo.innerHTML += `<tr><td>${cat}</td><td>R$ ${resumo[cat].toFixed(2)}</td></tr>`;
    });

    document.getElementById('valorTotal').innerText = `R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
    atualizarGrafico(resumo);
}

function atualizarGrafico(dados) {
    const ctx = document.getElementById('meuGrafico').getContext('2d');
    if (meuGrafico) meuGrafico.destroy();
    meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(dados),
            datasets: [{
                data: Object.values(dados),
                backgroundColor: ['#4285F4', '#34A853', '#FBBC05', '#EA4335', '#9C27B0', '#00BCD4', '#FF9800']
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } }, animation: false }
    });
}

async function gerarPDF() {
    const element = document.getElementById('area-report');
    const btn = document.querySelector('.btn-pdf');
    
    btn.innerText = "⏳ Gerando PDF de alta qualidade...";

    // Configurações para evitar páginas em branco e garantir texto real
    const opt = {
        margin: [15, 10, 15, 10],
        filename: `Relatorio_Hedy_${document.getElementById('filtroMes').value}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    // Esconde a coluna de edição antes de exportar
    const cols = document.querySelectorAll('.no-print-col');
    cols.forEach(c => c.style.display = 'none');

    try {
        await html2pdf().set(opt).from(element).save();
    } catch (e) {
        alert("Erro ao gerar PDF");
    } finally {
        cols.forEach(c => c.style.display = 'table-cell');
        btn.innerText = "📥 Baixar Relatório Profissional (PDF)";
    }
}

window.onload = () => {
    const hoje = new Date();
    document.getElementById('filtroMes').value = hoje.getFullYear() + "-" + String(hoje.getMonth() + 1).padStart(2, '0');
    carregarDados();
};
</script>

</body>
</html>
